# PR Labeler Configuration
# Automatically label PRs based on changed files

documentation:
  - changed-files:
	- any-glob-to-any-file: ['*.md', 'docs/**/*']

ui:
  - changed-files:
	- any-glob-to-any-file: ['**/*Designer.cs', '**/*.resx']

core:
  - changed-files:
	- any-glob-to-any-file: ['**/JsonFixer.cs', '**/Form1.cs']

dependencies:
  - changed-files:
	- any-glob-to-any-file: ['**/packages.config', '**/*.csproj']

ci:
  - changed-files:
	- any-glob-to-any-file: ['.github/**/*']

config:
  - changed-files:
	- any-glob-to-any-file: ['**/*.config', '**/*.json']
